<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Manage contributions and expenses efficiently">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kofund">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Android/Chrome theme color -->
  <meta name="theme-color" content="#00BFA6" />
  
  <!-- Windows meta tags -->
  <meta name="msapplication-TileColor" content="#00BFA6">
  <meta name="msapplication-TileImage" content="icons/Icon-192.png">

  <title>Kofund - Community Fund Management</title>
  <link rel="manifest" href="manifest.json">
  
  <style>
   html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  background-color: #00BFA6; /* same as your gradient base */
}

    
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background-color: #031412;
    }

    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #0a2e2b 0%, #031412 100%);
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      transition: opacity 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
    }
    
    .loader-card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 40px 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.4), 
                  inset 0 1px 1px rgba(255, 255, 255, 0.1);
      max-width: 90%;
      width: 280px;
    }
    
    .loader-wrapper {
      position: relative;
      width: 90px;
      height: 90px;
      margin-bottom: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    .ring {
      position: absolute;
      border-radius: 50%;
      border: 3px solid transparent;
    }
    
    .ring-outer {
      width: 100%;
      height: 100%;
      border-top-color: #00BFA6;
      border-bottom-color: #00BFA6;
      animation: spin-clockwise 2s linear infinite;
      box-shadow: 0 0 15px rgba(0, 191, 166, 0.2);
    }
    
    .ring-inner {
      width: 75%;
      height: 75%;
      border-left-color: #00897b;
      border-right-color: #00897b;
      animation: spin-counter 1.5s linear infinite;
      box-shadow: 0 0 10px rgba(0, 137, 123, 0.25);
    }
    
    .logo-center {
      width: 42px;
      height: 42px;
      background: #00BFA6;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 20px rgba(0, 191, 166, 0.6);
      animation: pulse-glow 2s ease-in-out infinite;
      z-index: 2;
    }
    
    .logo-center svg {
      width: 22px;
      height: 22px;
      fill: white;
    }
    
    .loader-text {
      color: #ffffff;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.5px;
      margin-top: 12px;
      text-align: center;
      background: linear-gradient(to right, #ffffff 20%, #00BFA6 50%, #ffffff 80%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shine 2.5s linear infinite;
    }
    
    .loader-subtext {
      color: rgba(255, 255, 255, 0.5);
      font-size: 13px;
      font-weight: 400;
      margin-top: 6px;
      letter-spacing: 0.5px;
    }
    
    @keyframes spin-clockwise {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    @keyframes spin-counter {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
    
    @keyframes pulse-glow {
      0%, 100% { transform: scale(1); box-shadow: 0 0 20px rgba(0, 191, 166, 0.6); }
      50% { transform: scale(1.08); box-shadow: 0 0 35px rgba(0, 191, 166, 0.85); }
    }
    
    @keyframes shine {
      to { background-position: -200% center; }
    }
    
    /* Hide loading when app loaded */
    .flutter-loaded #loading {
      opacity: 0;
      pointer-events: none;
    }
    
    /* Flutter app container */
    #flutter-app {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body style="background:#031412">
  <!-- Loading screen -->
  <div id="loading">
    <div class="loader-card">
      <div class="loader-wrapper">
        <div class="ring ring-outer"></div>
        <div class="ring ring-inner"></div>
        <div class="logo-center">
          <svg viewBox="0 0 24 24">
            <path d="M21,18v1c0,1.1-0.9,2-2,2H5c-1.11,0-2-0.9-2-2V5c0-1.1,0.89-2,2-2h14c1.1,0,2,0.9,2,2v1h-9c-1.11,0-2-0.9-2-2v8 c0,1.1,0.89,2,2,2H21z M12,6h10v6H12V6z M16,10c0.55,0,1-0.45,1-1s-0.45-1-1-1s-1,0.45-1,1S15.45,10,16,10z"/>
          </svg>
        </div>
      </div>
      <div class="loader-text">Initializing KoFund</div>
      <div class="loader-subtext">Loading Community Funds...</div>
    </div>
  </div>

  <!-- Flutter app container -->
  <div id="flutter-app"></div>

  <!-- Flutter initialization -->
  <script>
    // Service worker version - IMPORTANT!
    var serviceWorkerVersion = null;
    
    // Extract invite code
    function extractInviteCode() {
      try {
        const path = window.location.pathname;
        const segments = path.split('/').filter(s => s);
        
        // Format 1: /join/CODE
        if (segments.length >= 2 && segments[0] === 'join') {
          return segments[1];
        }
        
        // Format 2: URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get('code') || urlParams.get('invite');
      } catch (e) {
        console.error('Error extracting invite code:', e);
        return null;
      }
    }

    // Store invite code globally
    window.inviteCode = extractInviteCode();
    if (window.inviteCode) {
      console.log('Invite Code Found:', window.inviteCode);
      // Clean code
      window.inviteCode = window.inviteCode.replace(/[^a-zA-Z0-9]/g, '');
    }

    // Handle Flutter events
    window.addEventListener('flutter-initialized', function() {
      console.log('Flutter initialized');
      
      // Hide loading screen
      const loading = document.getElementById('loading');
      if (loading) {
        loading.style.opacity = '0';
        setTimeout(() => {
          loading.style.display = 'none';
        }, 300);
      }
      
      // Add loaded class to body
      document.body.classList.add('flutter-loaded');
      
      // Send invite code to Flutter if exists
      if (window.inviteCode && window._flutter) {
        // Flutter's message channel
        window._flutter.flutterChannel = window._flutter.flutterChannel || {
          postMessage: function(message) {
            // This will be called from Flutter
            console.log('Message to Flutter:', message);
          }
        };
      }
    });

    // Handle Flutter errors
    window.addEventListener('flutter-loading-error', function(event) {
      console.error('Flutter failed to load:', event);
      const loading = document.getElementById('loading');
      if (loading) {
        loading.innerHTML = `
          <div style="text-align: center; color: white; padding: 20px;">
            <h3>Failed to load application</h3>
            <p>Please refresh the page or check your connection.</p>
            <button onclick="window.location.reload()" 
                    style="background: white; color: #00BFA6; border: none; 
                           padding: 10px 20px; border-radius: 5px; cursor: pointer;
                           margin-top: 20px;">
              Refresh Page
            </button>
          </div>
        `;
      }
    });

    // Load Flutter when page loads
    window.addEventListener('load', function() {
      console.log('Page loaded, initializing Flutter...');
      
      // Create and load flutter.js script
      const flutterScript = document.createElement('script');
      flutterScript.src = 'flutter.js';
      flutterScript.type = 'application/javascript';
      
      flutterScript.onload = function() {
        console.log('flutter.js loaded, initializing Flutter engine...');
        
        // Check if Flutter loader is available
        if (typeof _flutter !== 'undefined' && _flutter.loader) {
          _flutter.loader.loadEntrypoint({
            serviceWorker: {
              serviceWorkerVersion: serviceWorkerVersion,
            },
            onEntrypointLoaded: async function(engineInitializer) {
              try {
                console.log('Flutter engine initializing...');
                
                // Initialize the engine with explicit container
            const appRunner = await engineInitializer.initializeEngine();

                
                console.log('Flutter engine initialized, running app...');
                
                // Run the app in our container
                await appRunner.runApp({
                  hostElement: document.getElementById('flutter-app')
                });
                
                console.log('Flutter app running');
                
                // Dispatch initialized event
                window.dispatchEvent(new CustomEvent('flutter-initialized'));
                
              } catch (error) {
                console.error('Failed to initialize Flutter:', error);
                
                // Show error
                const loading = document.getElementById('loading');
                if (loading) {
                  loading.innerHTML = `
                    <div style="text-align: center; color: white; padding: 20px;">
                      <h3>Failed to initialize application</h3>
                      <p>${error.message || 'Unknown error'}</p>
                      <button onclick="window.location.reload()" 
                              style="background: white; color: #00BFA6; border: none; 
                                     padding: 10px 20px; border-radius: 5px; cursor: pointer;
                                     margin-top: 20px;">
                        Retry
                      </button>
                    </div>
                  `;
                }
              }
            }
          });
        } else {
          console.error('Flutter loader not found');
          const loading = document.getElementById('loading');
          if (loading) {
            loading.innerHTML = `
              <div style="text-align: center; color: white; padding: 20px;">
                <h3>Failed to load Flutter runtime</h3>
                <p>The Flutter engine could not be loaded.</p>
                <button onclick="window.location.reload()" 
                        style="background: white; color: #00BFA6; border: none; 
                               padding: 10px 20px; border-radius: 5px; cursor: pointer;
                               margin-top: 20px;">
                  Retry
                </button>
              </div>
            `;
          }
        }
      };
      
      flutterScript.onerror = function(error) {
        console.error('Failed to load flutter.js:', error);
        const loading = document.getElementById('loading');
        if (loading) {
          loading.innerHTML = `
            <div style="text-align: center; color: white; padding: 20px;">
              <h3>Failed to load application resources</h3>
              <p>Please check your internet connection.</p>
              <button onclick="window.location.reload()" 
                      style="background: white; color: #00BFA6; border: none; 
                             padding: 10px 20px; border-radius: 5px; cursor: pointer;
                             margin-top: 20px;">
                Retry
              </button>
            </div>
          `;
        }
      };
      
      // Add script to document
      document.body.appendChild(flutterScript);
      
      // Your existing app opening logic
      (function tryOpenApp() {
        const code = window.inviteCode;
        if (!code) return;

        const schemeLink = `kofund://join?code=${code}`;
        const start = Date.now();
        let opened = false;

        const onVisibility = () => { if (document.hidden) opened = true; };
        document.addEventListener('visibilitychange', onVisibility);

        const iframe = document.createElement('iframe');
        iframe.style.display = 'none';
        iframe.src = schemeLink;
        document.body.appendChild(iframe);

        setTimeout(() => { 
          try { 
            window.location = schemeLink; 
          } catch (e) {
            console.log('Could not redirect to app:', e);
          }
        }, 120);

        setTimeout(() => {
          document.removeEventListener('visibilitychange', onVisibility);
          try { 
            document.body.removeChild(iframe); 
          } catch (e) {
            console.log('Could not remove iframe:', e);
          }
          if (!opened && Date.now() - start > 1600) {
            console.log('Native app not opened — staying on web.');
          }
        }, 2000);
      })();
    });
  </script>
</body>
</html>
