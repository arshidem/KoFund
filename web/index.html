<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="KoFund is the ultimate tool for committees, mosque groups, sports clubs, and families to track contributions, log expenses, manage members, and publish transparent, real-time ledgers without the clutter of WhatsApp group messages.">
  <meta name="keywords" content="community fund manager, committee budget tracker, mosque donation ledger, transparent fund manager, sports club finance app, joint savings tracker">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kofund">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Android/Chrome theme color -->
  <meta name="theme-color" content="#00BFA6" />
  
  <!-- Windows meta tags -->
  <meta name="msapplication-TileColor" content="#00BFA6">
  <meta name="msapplication-TileImage" content="icons/Icon-192.png">

  <title>KoFund - Transparent Community Fund & Committee Expense Manager</title>
  <link rel="manifest" href="manifest.json">
  
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background-color: #f4fbf9;
    }

    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #ffffff 0%, #e8f7f5 100%);
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      transition: opacity 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
    }
    
    .splash-container {
      position: relative;
      width: 220px;
      height: 220px;
      background: rgba(0, 191, 166, 0.1);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 40px;
    }
    
    .ripple {
      position: absolute;
      width: 170px;
      height: 170px;
      border-radius: 50%;
      border: 2px solid rgba(0, 191, 166, 0.5);
      opacity: 0;
      transform: scale(1);
      animation: ripple-effect 2s cubic-bezier(0.16, 1, 0.3, 1) infinite;
    }
    
    .ripple:nth-child(1) {
      animation-delay: 0s;
    }
    .ripple:nth-child(2) {
      animation-delay: 0.4s;
    }
    .ripple:nth-child(3) {
      animation-delay: 0.8s;
    }
    
    .logo-bg {
      position: absolute;
      width: 170px;
      height: 170px;
      background: #00BFA6;
      border-radius: 50%;
      box-shadow: 0 12px 50px 6px rgba(0, 191, 166, 0.4);
      z-index: 1;
    }
    
    .logo-wrapper {
      position: absolute;
      width: 90px;
      height: 90px;
      z-index: 2;
      display: flex;
      justify-content: center;
      align-items: center;
      animation: logo-breath 2.5s ease-in-out infinite alternate;
    }
    
    .kofund-logo-svg {
      width: 90px;
      height: 90px;
    }
    
    @keyframes ripple-effect {
      0% {
        transform: scale(1);
        opacity: 0.4;
      }
      100% {
        transform: scale(1.8);
        opacity: 0;
      }
    }
    
    @keyframes logo-breath {
      0% {
        transform: scale(1);
        opacity: 1;
      }
      100% {
        transform: scale(1.05);
        opacity: 0.85;
      }
    }
    
    /* Hide loading when app loaded */
    .flutter-loaded #loading {
      opacity: 0;
      pointer-events: none;
    }
    
    /* Flutter app container */
    #flutter-app {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body style="background:#f4fbf9">
  <!-- Loading screen -->
  <div id="loading">
    <div class="splash-container">
      <div class="ripple"></div>
      <div class="ripple"></div>
      <div class="ripple"></div>
      <div class="logo-bg"></div>
      <div class="logo-wrapper">
        <svg class="kofund-logo-svg" viewBox="0 0 96 90.59">
          <polygon points="89.84 0 23.76 66.63 0 90.59 0 15.9 23.76 15.9 23.76 47.01 89.84 0" style="fill: #052224;"/>
          <polygon points="84.66 90.59 52.18 90.59 31.7 69.71 48.04 53.24 84.66 90.59" style="fill: #fff;"/>
          <polygon points="96 4.88 67.69 60.18 54.5 46.73 96 4.88" style="fill: #fff;"/>
        </svg>
      </div>
    </div>
  </div>

  <!-- Flutter app container -->
  <div id="flutter-app"></div>

  <!-- Custom pre-Flutter logic -->
  <script>
    // Extract invite code
    function extractInviteCode() {
      try {
        const path = window.location.pathname;
        const segments = path.split('/').filter(s => s);
        
        // Format 1: /join/CODE
        if (segments.length >= 2 && segments[0] === 'join') {
          return segments[1];
        }
        
        // Format 2: URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get('code') || urlParams.get('invite');
      } catch (e) {
        console.error('Error extracting invite code:', e);
        return null;
      }
    }

    // Store invite code globally
    window.inviteCode = extractInviteCode();
    if (window.inviteCode) {
      console.log('Invite Code Found:', window.inviteCode);
      window.inviteCode = window.inviteCode.replace(/[^a-zA-Z0-9]/g, '');
    }

    function tryOpenNativeAppForInvite() {
      const code = window.inviteCode;
      if (!code) return;

      const userAgent = navigator.userAgent || '';
      const isAndroid = /Android/i.test(userAgent);
      const isIOS = /iPhone|iPad|iPod/i.test(userAgent);
      if (!isAndroid && !isIOS) return;

      const attemptKey = `kofund-native-open:${code}`;
      try {
        if (sessionStorage.getItem(attemptKey) === '1') return;
        sessionStorage.setItem(attemptKey, '1');
      } catch (e) {
        console.log('Could not store native-open attempt:', e);
      }

      const encodedCode = encodeURIComponent(code);
      const currentUrl = window.location.href;

      if (isAndroid) {
        const fallbackUrl = encodeURIComponent(currentUrl);
        window.location.href =
          `intent://join?code=${encodedCode}` +
          `#Intent;scheme=kofund;package=com.kofund.app;` +
          `S.browser_fallback_url=${fallbackUrl};end`;
        return;
      }

      const iframe = document.createElement('iframe');
      iframe.style.display = 'none';
      iframe.src = `kofund://join?code=${encodedCode}`;
      document.body.appendChild(iframe);

      setTimeout(() => {
        try {
          document.body.removeChild(iframe);
        } catch (e) {
          console.log('Could not remove native-open iframe:', e);
        }
      }, 1500);
    }
    var splashHidden = false;
    window.hideFlutterSplash = function() {
      if (splashHidden) return;
      splashHidden = true;
      console.log('Hiding Flutter splash screen...');
      const loading = document.getElementById('loading');
      if (loading) {
        loading.style.opacity = '0';
        setTimeout(() => {
          loading.style.display = 'none';
        }, 300);
      }
      document.body.classList.add('flutter-loaded');
    };

    // Automatically hide splash when Flutter's glass-pane canvas is injected into DOM
    const observer = new MutationObserver((mutationsList, obs) => {
      const glassPane = document.querySelector('flt-glass-pane') || document.querySelector('flt-scene-host');
      if (glassPane) {
        window.hideFlutterSplash();
        obs.disconnect();
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });

    // Fallback: hide splash after 10 seconds if observer hasn't triggered yet
    setTimeout(() => {
      if (!splashHidden) {
        console.log('Fallback: Hiding splash screen (timeout)...');
        window.hideFlutterSplash();
      }
    }, 10000);

    // Handle Flutter errors
    window.addEventListener('flutter-loading-error', function(event) {
      console.error('Flutter failed to load:', event);
      const loading = document.getElementById('loading');
      if (loading) {
        loading.innerHTML = `
          <div style="text-align: center; color: #333; padding: 20px;">
            <h3>Failed to load application</h3>
            <p>Please refresh the page or check your connection.</p>
            <button onclick="window.location.reload()" 
                    style="background: #00BFA6; color: white; border: none; 
                           padding: 10px 20px; border-radius: 5px; cursor: pointer;
                           margin-top: 20px;">
              Refresh Page
            </button>
          </div>
        `;
      }
    });

    // Try the installed app for invite links, then fall back to Flutter web.
    window.addEventListener('load', function() {
      setTimeout(tryOpenNativeAppForInvite, 300);
    });
  </script>

  <!-- Flutter bootstrap (auto-generated by flutter build web) -->
  {{flutter_bootstrap_js}}
</body>
</html>
