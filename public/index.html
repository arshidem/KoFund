<!DOCTYPE html>
<html>
<head>
    <title>KoFund - Community Fund Management</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .container {
            max-width: 600px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
        }
        .button {
            display: inline-block;
            margin: 20px;
            padding: 15px 30px;
            background: white;
            color: #667eea;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            transition: transform 0.3s;
        }
        .button:hover {
            transform: translateY(-5px);
        }
        .code-display {
            background: white;
            color: #333;
            padding: 20px;
            border-radius: 10px;
            font-size: 24px;
            font-weight: bold;
            margin: 20px 0;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="redirecting">
            <h1>🎯 KoFund</h1>
            <p>Opening KoFund app...</p>
            <p id="invite-code-display"></p>
        </div>
        when i click this showing no route defined for /?code={invitecode}
        <div id="manual-fallback" style="display: none;">
            <h1>Join KoFund Community</h1>
            <p>Copy this invite code:</p>
            <div class="code-display" id="code-display"></div>
            <p>Open the KoFund app and enter this code</p>
            
            <div style="margin: 30px 0;">
                <button onclick="copyCode()" class="button">📋 Copy Code</button>
                <a href="kofund://join" class="button">📱 Open App</a>
            </div>
            
            <p style="font-size: 0.9rem; opacity: 0.8;">
                Having trouble? Contact support@kofund.app
            </p>
        </div>
    </div>
    
    <script>
        // Extract invite code from URL
        function extractInviteCode() {
            const path = window.location.pathname; // e.g., "/join/CUOVUA3H"
            const segments = path.split('/').filter(s => s);
            // Format 1: /join/CODE
            if (segments.length >= 2 && segments[0] === 'join') return segments[1];
            // Format 2: ?code=CODE
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('code');
        }

        function copyCode() {
            const code = extractInviteCode();
            if (code) navigator.clipboard.writeText(code).then(()=> alert('Code copied: ' + code));
        }

        // Try to open native app; if not installed, show manual fallback UI
        function handleInviteLink() {
            const inviteCode = extractInviteCode();
            if (!inviteCode) {
                document.getElementById('redirecting').innerHTML = `
                    <h1>🎯 KoFund</h1>
                    <p>Community Fund Management App</p>
                    <p>Download the app from your app store.</p>
                `;
                return;
            }

            document.getElementById('invite-code-display').textContent = `Invite Code: ${inviteCode}`;
            document.getElementById('code-display').textContent = inviteCode;

            const schemeLink = `kofund://join?code=${inviteCode}`;
            const start = Date.now();
            let opened = false;

            const onVisibility = () => { if (document.hidden) opened = true; };
            document.addEventListener('visibilitychange', onVisibility);

            // Android intent fallback (stronger on many devices)
            const isAndroid = /Android/i.test(navigator.userAgent || '');
            if (isAndroid) {
                const packageName = 'com.kofund.app';
                const fallbackUrl = encodeURIComponent(window.location.href);
                const intentUrl = `intent://join?code=${inviteCode}#Intent;scheme=kofund;package=${packageName};S.browser_fallback_url=${fallbackUrl};end`;
                try { window.location = intentUrl; } catch(e){}
            }

            // iframe attempt
            const iframe = document.createElement('iframe');
            iframe.style.display = 'none';
            iframe.src = schemeLink;
            document.body.appendChild(iframe);

            // also try location for iOS
            setTimeout(() => { try { window.location = schemeLink; } catch(e){} }, 120);

            // After timeout show manual fallback if app didn't open
            setTimeout(() => {
                document.removeEventListener('visibilitychange', onVisibility);
                try { document.body.removeChild(iframe); } catch(e){}
                if (!opened && Date.now() - start > 1600) {
                    document.getElementById('redirecting').style.display = 'none';
                    document.getElementById('manual-fallback').style.display = 'block';
                }
            }, 2000);
        }

        window.onload = handleInviteLink;
    </script>
</body>
</html>
