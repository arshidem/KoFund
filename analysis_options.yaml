include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - '**/*.g.dart'
    - '**/*.freezed.dart'
    - '**/generated/**'
    - 'build/**'
  errors:
    # Downgrade warnings to info/warning
    deprecated_member_use: info
    unused_import: info
    unused_local_variable: info
    unused_element: info
    unused_field: info
    unreachable_switch_case: info
    dead_code: info
    unnecessary_type_check: info
    avoid_print: info
    prefer_final_fields: info
    use_build_context_synchronously: info
    non_constant_identifier_names: info
    avoid_types_as_parameter_names: info
    with_opacity: info

linter:
  rules:
    - avoid_print
    - prefer_final_fields
    - use_build_context_synchronously
    - non_constant_identifier_names
    - avoid_types_as_parameter_names
    - deprecated_member_use
    - unused_local_variable
    - unused_import
    - dead_code
    - unreachable_switch_case
    - unnecessary_type_check
    - unused_element
    - unused_field