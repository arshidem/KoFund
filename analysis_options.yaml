include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - '**/*.g.dart'
    - '**/*.freezed.dart'
    - '**/generated/**'
    - 'build/**'
  
  errors:
    # Treat these as warnings (should fix)
    deprecated_member_use: warning
    unused_import: warning
    unused_local_variable: warning
    
    # Downgrade these to info (can ignore)
    avoid_print: info
    prefer_final_fields: info
    use_build_context_synchronously: info
    unused_element: info
    unused_field: info
    unreachable_switch_case: info
    dead_code: info
    unnecessary_type_check: info

linter:
  rules:
    - use_build_context_synchronously
    - avoid_print
    - prefer_final_fields