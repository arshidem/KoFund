name: kofund
description: "A new Flutter project."
publish_to: 'none'

version: 1.1.0+1

environment:
  sdk: ^3.9.2


flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logos/KoFund.png"
  adaptive_icon_background: "#00bfa6"
  adaptive_icon_foreground: "assets/logos/KoFund.png"


dependencies:
  flutter:
    sdk: flutter

  # 🔥 Firebase packages (latest stable versions)
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.2
  firebase_storage: ^12.2.0
  firebase_messaging: ^15.2.10
  shared_preferences: ^2.3.2
  firebase_app_check: ^0.3.2+10

  # 🔐 Google Sign-In
  google_sign_in: ^6.1.5
  pull_to_refresh: ^2.0.0

  # 📱 Utils
  provider: ^6.1.2
  uuid: ^4.5.0
  intl: ^0.19.0
  flutter_spinkit: ^5.2.1
  cupertino_icons: ^1.0.8
  pdf: ^3.10.1
  printing: ^5.11.0
  share_plus: ^7.0.1
  path_provider: ^2.1.1
  shimmer: ^3.0.0
  change_app_package_name: ^1.5.0
  google_mobile_ads: ^6.0.0
  flutter_local_notifications: ^17.2.1
  go_router: ^9.0.3
  cloud_functions: ^5.6.2
  fl_chart: ^1.1.1
  collection: ^1.19.1
  flutter_svg: ^1.1.6
  badges: ^3.1.1
  animations: ^2.0.6
  clipboard: ^3.0.8
  url_launcher: ^6.1.10
  app_links: ^6.4.1
  package_info_plus: ^4.0.2
  connectivity_plus: ^5.0.2
  font_awesome_flutter: ^10.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/logos/google_logo.png
    - assets/logos/KoFund.png
    - assets/fonts/NotoSans-Regular.ttf
    - assets/icons/checked.png

