<!DOCTYPE html>
<html>
<head>
  <!--

    This is a placeholder for base href that will be replaced by the value of

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="kofund">
  <link rel="apple-touch-icon" href="assets/logos/KoFund.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/logos/KoFund.png"/>

  <title>KoFund - Community Fund Management</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      margin: 0;
      padding: 0;
    }
  </style>
</head>
<body>
  <!-- Invite Code Handler -->
  <script>
    // Extract invite code from URL and store globally
    function extractInviteCode() {
      const path = window.location.pathname;
      const segments = path.split('/').filter(s => s);
      // Format 1: /join/CODE
      if (segments.length >= 2 && segments[0] === 'join') return segments[1];
      // Format 2: ?code=CODE
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('code');
    }

    window.inviteCode = extractInviteCode();
    console.log('Invite Code Found:', window.inviteCode);

    // If invite code exists, attempt to open native app first.
    // Use the custom URL scheme (kofund://) and a short timeout fallback
    // so mobile browsers stay on the web when the app isn't installed.
    (function tryOpenApp() {
      const code = window.inviteCode;
      if (!code) return;

      const schemeLink = `kofund://join?code=${code}`;
      const start = Date.now();
      let opened = false;

      const onVisibility = () => { if (document.hidden) opened = true; };
      document.addEventListener('visibilitychange', onVisibility);

      // Try custom scheme via hidden iframe (works on many Android browsers)
      const iframe = document.createElement('iframe');
      iframe.style.display = 'none';
      iframe.src = schemeLink;
      document.body.appendChild(iframe);

      // Also try direct navigation (helps iOS and some browsers)
      setTimeout(() => { try { window.location = schemeLink; } catch (e) {} }, 120);

      // After timeout, if app was not opened, remove iframe and continue with web
      setTimeout(() => {
        document.removeEventListener('visibilitychange', onVisibility);
        try { document.body.removeChild(iframe); } catch (e) {}
        if (!opened && Date.now() - start > 1600) {
          console.log('Native app not opened — staying on web.');
          document.body.classList.add('app-not-installed');
        }
      }, 2000);
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>

  <!-- Script to pass invite code to Flutter app -->
  <script>
    // Once Flutter is ready, navigate to join screen if invite code exists
    window.addEventListener('flutter-initialized', function() {
      if (window.inviteCode) {
        // Send message to Flutter app
        Dart_PostMessage('inviteCode', window.inviteCode);
      }
    });
  </script>
</body>
</html>
